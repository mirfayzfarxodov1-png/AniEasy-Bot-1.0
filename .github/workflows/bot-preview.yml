name: AniEasy Bot 1.0 — Temporary Preview

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  bot:
    name: Run AniEasy Bot 1.0
    runs-on: ubuntu-latest
    timeout-minutes: 360
    env:
      BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
      ADMIN_IDS: ${{ secrets.ADMIN_IDS }}
      OWNER_ID: ${{ secrets.OWNER_ID }}
      CHANNEL_ID: ${{ secrets.CHANNEL_ID }}
      LOG_CHANNEL_ID: ${{ secrets.LOG_CHANNEL_ID }}
      WEBAPP_URL: ${{ secrets.WEBAPP_URL }}
      PAGINATION_SIZE: "10"
      DESCRIPTION_TEMPLATE: "🎬 {anime_name}\n📺 {episode}-qism"
      LOG_LEVEL: "INFO"
      DATABASE_URL: sqlite+aiosqlite:///./anime_bot.db
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Start AniEasy Bot 1.0
        run: python -m app.main
